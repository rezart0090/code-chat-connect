databases:
  - name: chat-db
    plan: free

services:
  - type: web
    name: chat-socket
    runtime: node
    rootDir: socket
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SOCKET_SECRET
        generateValue: true
      - key: LARAVEL_URL
        sync: false

  - type: web
    name: chat-api
    runtime: node
    rootDir: nextjs
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chat-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SOCKET_URL
        sync: false
      - key: SOCKET_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
