services:
  - type: web
    name: chat-socket
    runtime: node
    rootDir: socket
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SOCKET_SECRET
        generateValue: true
      - key: LARAVEL_URL
        sync: false

  - type: web
    name: chat-api
    runtime: docker
    rootDir: laravel
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SOCKET_URL
        sync: false
      - key: SOCKET_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
